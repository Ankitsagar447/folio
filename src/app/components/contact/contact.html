<section class="contact-section container">
    <div class="contact-content">
        <h1 class="contact-heading">Reach out.</h1>
        <p class="contact-intro">
            I’d love to hear from you. Whether you’re looking to discuss enterprise Angular architecture, collaborate on a project, or simply connect.
        </p>

        <div class="contact-info-cards">
            <div class="info-item">
                <span class="info-label mono-text">Email</span>
                <a href="mailto:sagarankit000@gmail.com" class="info-value">sagarankit000@gmail.com</a>
            </div>
            <div class="info-item">
                <span class="info-label mono-text">Phone</span>
                <a href="tel:+917667443299" class="info-value">(+91) 7667443299</a>
            </div>
            <div class="info-item">
                <span class="info-label mono-text">Location</span>
                <span class="info-value">Jaipur, Rajasthan</span>
            </div>
            <div class="info-item">
                <span class="info-label mono-text">Profiles</span>
                <div class="social-links-inline">
                    <a href="https://www.linkedin.com/in/sagarankit000/" target="_blank" class="social-text-link">LinkedIn</a>
                    <span>&bull;</span>
                    <a href="https://github.com/Ankitsagar447" target="_blank" class="social-text-link">GitHub</a>
                </div>
            </div>
        </div>

        <form (submit)="onSubmit($event)" class="contact-form">
            <input type="hidden" name="access_key" value="e4b1e701-3819-4d52-9bb2-e027de8995cb">
            <div class="form-group">
                <label for="name" class="sr-only">Name</label>
                <input type="text" id="name" name="name" placeholder="Name*" required class="form-input">
            </div>

            <div class="form-group">
                <label for="email" class="sr-only">Email</label>
                <input type="email" id="email" name="email" placeholder="Email*" required class="form-input">
            </div>

            <div class="form-group">
                <label for="phone" class="sr-only">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="Phone" class="form-input">
            </div>

            <div class="form-group">
                <label for="message" class="sr-only">Message</label>
                <textarea id="message" name="message" placeholder="Message*" required class="form-input message-input"
                    rows="1"></textarea>
            </div>

            <button type="submit" class="submit-btn" [disabled]="isSubmitting">Send Message</button>
            <p *ngIf="resultMessage" class="result-message" [class.success]="isSuccess" [class.error]="!isSuccess">{{
                resultMessage }}</p>
        </form>
    </div>
</section>
