[build]
  base = "client"
  publish = "dist/portfolio-app/browser"
  command = "npm run build"

# Proxy /api requests to the live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://folio-6x1g.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
