<nav class="navbar" [class.dark]="themeService.isDark()">
    <div class="navbar-container">
        <!-- Logo -->
        <div class="nav-left">
            <a routerLink="/" class="logo-wrapper" (click)="closeMobileMenu()">
                <span class="logo-text">Ankit Sagar</span>
            </a>
        </div>

        <!-- Desktop Nav Links (center) -->
        <div class="nav-center">
            <ul class="nav-links">
                <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
                <li><a routerLink="/about" routerLinkActive="active">About</a></li>
                <li><a routerLink="/work" routerLinkActive="active">Work</a></li>
                <li><a routerLink="/projects/hobbies" routerLinkActive="active">Hobbies</a></li>
                <li><a routerLink="/contact" routerLinkActive="active">Contact</a></li>
            </ul>
        </div>

        <!-- Right: Time + Theme Toggle + Hamburger -->
        <div class="nav-right">
            <span class="mono-text time-display">
                {{ currentTime() | date:'dd MMM HH:mm:ss' }} (IST)
            </span>

            <!-- Theme Toggle Button -->
            <button class="theme-toggle-btn"
                    (click)="themeService.toggle()"
                    [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
                    [title]="themeService.isDark() ? 'Light Mode' : 'Dark Mode'">
                @if (themeService.isDark()) {
                    <!-- Sun icon (switch to light) -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                } @else {
                    <!-- Moon icon (switch to dark) -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                }
            </button>

            <!-- Hamburger (mobile only) -->
            <button class="hamburger-btn"
                    (click)="toggleMobileMenu()"
                    [class.open]="isMobileMenuOpen()"
                    aria-label="Toggle navigation menu">
                <span class="ham-line"></span>
                <span class="ham-line"></span>
                <span class="ham-line"></span>
            </button>
        </div>
    </div>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" [class.open]="isMobileMenuOpen()">
        <ul class="mobile-nav-links" (click)="closeMobileMenu()">
            <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
            <li><a routerLink="/about" routerLinkActive="active">About</a></li>
            <li><a routerLink="/work" routerLinkActive="active">Work</a></li>
            <li><a routerLink="/projects/hobbies" routerLinkActive="active">Hobbies</a></li>
            <li><a routerLink="/contact" routerLinkActive="active">Contact</a></li>
        </ul>
        <div class="mobile-footer mono-text">
            {{ currentTime() | date:'dd MMM yyyy, HH:mm' }} IST
        </div>
    </div>

    <!-- Mobile Backdrop -->
    @if (isMobileMenuOpen()) {
        <div class="mobile-backdrop" (click)="closeMobileMenu()"></div>
    }
</nav>
